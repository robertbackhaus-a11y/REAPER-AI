[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reaper-ai"
version = "0.9.0"
description = "Local autonomous coding agent powered by LangGraph and Ollama"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "langgraph>=1.2,<2",
    "httpx>=0.28,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "mcp>=2,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reaper_ai"]
